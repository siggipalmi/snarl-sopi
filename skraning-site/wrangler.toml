name = "skraning"
main = "src/worker.js"
compatibility_date = "2026-08-21"

# Served at https://skraning.agvending.is. Needs the agvending.is zone on this
# Cloudflare account (the "agvending" Worker already serves agvending.is there).
routes = [
  { pattern = "skraning.agvending.is", custom_domain = true },
]

# public/ is the form. Any path that is not a file (i.e. /api/*) goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Retries anything that did not reach Zapier (see src/worker.js, retryDue).
[triggers]
crons = ["*/5 * * * *"]

# Every registration is kept here, with its step, attempts and last error.
# This is the database that is already live; it was created with
#   npx wrangler d1 create skraning
# and its schema loaded with
#   npx wrangler d1 execute skraning --remote --file=schema.sql
# The id is an identifier, not a secret — it does nothing without account
# credentials — and this file is where wrangler expects to read it. It has to
# stay here: a deploy pushes this file's contents over the live configuration,
# so a placeholder in it would replace a working binding with a broken one.
[[d1_databases]]
binding = "DB"
database_name = "skraning"
database_id = "6cc6e2d2-aaf8-412a-ba22-7981f059e790"

# The two lookup Workers that already power the Squarespace form, called directly
# instead of over the public internet. Both are bound to their production
# environment, which is what the deployed Worker already uses.
[[services]]
binding = "COMPANY"
service = "skattur-company-lookup"
environment = "production"

[[services]]
binding = "ADDRESS"
service = "iceland-address-proxy"
environment = "production"

[vars]
BACKEND_URL = "https://admin.agvending.is"
COMPANY_API = "https://skattur-company-lookup.siggip.workers.dev"
ADDRESS_API = "https://iceland-address-proxy.siggip.workers.dev"
# Hagstofa PxWeb table for Vísitala neysluverðs. Check /api/cpi after deploying.
CPI_TABLE = "Efnahagur/visitolur/1_vnv/1_vnv/VIS01000.px"
# Optional Cloudflare Turnstile. Leave empty to rely on the honeypot only.
TURNSTILE_SITE_KEY = ""

# Secrets (npx wrangler secret put <NAME>):
#   ZAPIER_HOOK_URL     the Catch Hook URL from the Zap's new trigger
#   LEASE_CLAIM_SECRET  same value as LEASE_CLAIM_SECRET on the backend
#   ADMIN_TOKEN         any long random string, for /api/admin/*
#   PROVISION_KEY       same value as PROVISION_KEY on the backend; creates the aðalnotandi's login
#   TURNSTILE_SECRET    optional, pairs with TURNSTILE_SITE_KEY
#   CPI_OVERRIDE        optional, e.g. "694.6@2026M08", only if Hagstofa is unreachable
