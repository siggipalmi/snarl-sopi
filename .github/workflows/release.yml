# Build, test, sign and publish every fridge version that lands on main.
#
# Bump versionCode + versionName in app/build.gradle.kts, merge to main, and
# this attaches the APK to a `fridge-v<versionName>` release on
# siggipalmi/snarl-sopi. The dashboard's "load latest fridge build" button then
# fills the OTA publish form from that release; who gets it is still chosen by
# hand there. Nothing here reaches a machine on its own.
#
# The release lives on snarl-sopi, not here, because this repo is private and
# the backend fetches the APK without credentials.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEBUG_KEYSTORE_BASE64     base64 of the ~/.android/debug.keystore every
#                             machine's APK was signed with. Android refuses an
#                             update signed with any other key, so a build
#                             signed with the runner's own key could never
#                             install over the fleet.
#   SNARL_SOPI_RELEASE_TOKEN  fine-grained token, Contents: read and write on
#                             siggipalmi/snarl-sopi only.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_REPO: siggipalmi/snarl-sopi
      GH_TOKEN: ${{ secrets.SNARL_SOPI_RELEASE_TOKEN }}
      # The certificate every machine's installed APK carries. The built APK is
      # checked against this, not the keystore file: on 2026-10-01 the keystore
      # was right and the APK was signed with another key anyway.
      FLEET_CERT_SHA256: c3d1dfdb1cce516d5c4c983c4bfe50a5ef2a673c296696d4e18413974a746f52
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          code=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=fridge-v$name" >> "$GITHUB_OUTPUT"
          echo "fridge $name (versionCode $code)"

      - name: Skip if already released
        id: exists
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.version.outputs.tag }} is already released — bump versionCode and versionName to publish a new build."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        if: steps.exists.outputs.already == 'false'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install the fleet signing key
        if: steps.exists.outputs.already == 'false'
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set. Without the fleet's key the APK cannot update any machine."
            exit 1
          fi
          mkdir -p ~/.android
          echo "FLEET_DEBUG_KEYSTORE=$HOME/.android/fleet-debug.keystore" >> "$GITHUB_ENV"
          # Strip whitespace first: a secret pasted from a terminal can carry
          # line breaks or a trailing newline that a strict decode rejects.
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > ~/.android/fleet-debug.keystore
          echo "keystore: $(wc -c < ~/.android/fleet-debug.keystore) bytes"
          # keytool prints its errors on stdout, so filtering its output for
          # the fingerprint hid the reason it failed. Show it when it fails.
          if ! out=$(keytool -list -v -keystore ~/.android/fleet-debug.keystore \
                       -storepass android -alias androiddebugkey 2>&1); then
            echo "$out" | head -5
            echo "::error::keytool cannot read the keystore from DEBUG_KEYSTORE_BASE64 (see above)"
            exit 1
          fi
          echo "$out" | grep -E "SHA256:"

      - name: Build and test
        if: steps.exists.outputs.already == 'false'
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log
          # One APK serves every machine. A build carrying a machine's identity
          # provisions every machine it reaches as that machine.
          grep -q "snarl-fridge provisioning: deviceCode=<none>, machineKey=<none>" build.log || {
            echo "::error::build carries a machine identity — refusing to release"; exit 1; }

      - name: Verify the APK carries the fleet's certificate
        if: steps.exists.outputs.already == 'false'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          got=$("$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
                  | grep -oP 'Signer #1 certificate SHA-256 digest: \K[0-9a-f]+')
          echo "APK certificate: $got"
          echo "fleet expects:   $FLEET_CERT_SHA256"
          if [ "$got" != "$FLEET_CERT_SHA256" ]; then
            echo "::error::The APK is not signed with the fleet's key. Every machine would refuse it (INSTALL_FAILED_UPDATE_INCOMPATIBLE). Not releasing."
            exit 1
          fi

      - name: Publish release
        if: steps.exists.outputs.already == 'false'
        run: |
          apk="snarl-fridge-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          # Changes since the previous fridge release: its notes record the
          # commit it was built from.
          prev_tag=$(gh release list --repo "$RELEASE_REPO" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("fridge-v"))][0].tagName // empty')
          prev_sha=""
          if [ -n "$prev_tag" ]; then
            prev_sha=$(gh release view "$prev_tag" --repo "$RELEASE_REPO" --json body --jq .body \
              | grep -oP '^commit: \K[0-9a-f]{40}' || true)
          fi
          {
            echo "versionCode: ${{ steps.version.outputs.code }}"
            echo "versionName: ${{ steps.version.outputs.name }}"
            echo "commit: ${{ github.sha }}"
            echo "sha256: $(sha256sum "$apk" | cut -d' ' -f1)"
            echo
            if [ -n "$prev_sha" ] && git cat-file -e "$prev_sha" 2>/dev/null; then
              echo "Changes since $prev_tag:"
              git log --no-merges --format='- %s' "$prev_sha..${{ github.sha }}"
            else
              echo "Recent changes:"
              git log --no-merges --format='- %s' -n 15
            fi
          } > notes.md
          gh release create "${{ steps.version.outputs.tag }}" "$apk" \
            --repo "$RELEASE_REPO" \
            --title "fridge v${{ steps.version.outputs.name }}" \
            --notes-file notes.md
          echo "::notice::Released ${{ steps.version.outputs.tag }} — load it from the dashboard's App updates panel."
